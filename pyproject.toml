[project]
name = "nexolu-payments-core"
version = "0.1.0"
description = "Nexolu Payments Core: pasarela de pagos unificada y agnostica a la app que se integra (Wompi hoy, extensible a otros proveedores) para todo el ecosistema Nexolu (POS, IA Core y futuras aplicaciones)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "httpx>=0.27",
    "cryptography>=43.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.35",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nexolu_payments_core*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# DTZ: el servicio guarda timestamps como UTC "naive" a proposito (misma
# convencion que nexolu-ia-core, ver su pyproject.toml) para evitar el
# problema de columnas DateTime aware/naive entre SQLite y Postgres.
# B008: `Depends(...)` como valor por defecto es el patron idiomatico de
# FastAPI, no una llamada accidental en tiempo de definicion.
ignore = ["DTZ", "B008"]
